<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saku">
  <!-- SAKU app icon — Konsep B: a single selected radio button.
       The whole product philosophy in one mark: pick exactly one. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BA99C"/>
      <stop offset="1" stop-color="#2E8C81"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="248" fill="none" stroke="#F7F6F2" stroke-width="52"/>
  <!-- Inner filled dot — coral dopamine accent (the "selected" state) -->
  <circle cx="512" cy="512" r="120" fill="#FF7A59"/>
</svg>
